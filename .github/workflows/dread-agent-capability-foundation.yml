name: DREAD agent and capability foundation

on:
  push:
    branches:
      - feature/agent-capability-foundation-2026-11-17

permissions:
  contents: read

concurrency:
  group: dread-agent-readonly-discovery
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download and verify the exact uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/dreaddo151-sys/koko/releases/download/dread-universal-v0.4.0-test/DREAD_UNIVERSAL_COMPLETE_TRUE.zip" \
            --output /tmp/dread-upload.zip
          echo "8a53dc9afb80b01bdf88b24b46df7d3bd58d98b67437efb2d9fdee9fb80394c0  /tmp/dread-upload.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dread-source"
          unzip -q /tmp/dread-upload.zip -d "$RUNNER_TEMP/dread-source"
          test -f "$RUNNER_TEMP/dread-source/tmp/dread_zip_check/DREAD-UNIVERSAL/dread_universal/Cargo.toml"
          echo "WORKSPACE=$RUNNER_TEMP/dread-source/tmp/dread_zip_check/DREAD-UNIVERSAL/dread_universal" >> "$GITHUB_ENV"

      - name: Apply the previously verified hardening patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          patch --batch --forward -p0 < "$GITHUB_WORKSPACE/audit-tools/discovery-hardening.patch"
          patch --batch --forward -p0 < "$GITHUB_WORKSPACE/audit-tools/gpu-api-hardening.patch"
          cd "$WORKSPACE/.."
          awk '
            index($0, "--- dread_universal/integrations/pstack/README.md") == 1 { skip=1 }
            index($0, "--- dread_universal/scripts/import-pstack.sh") == 1 { skip=0 }
            !skip { print }
          ' "$GITHUB_WORKSPACE/audit-tools/docs.patch" | patch --batch --forward -p0
          cp "$GITHUB_WORKSPACE/audit-tools/PSTACK_README.md" "$WORKSPACE/integrations/pstack/README.md"
          patch --batch --forward -p0 < "$GITHUB_WORKSPACE/audit-tools/pstack-pin-correction.patch"
          cp "$GITHUB_WORKSPACE/audit-tools/PROJECT_STATUS.md" "$WORKSPACE/docs/PROJECT_STATUS.md"

      - name: Apply provider-neutral agent and capability foundation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/audit-tools/agent-capability-foundation.patch"
          grep -q 'name = "dread-agents"' Cargo.lock
          test -f crates/dread-agents/src/lib.rs
          grep -q 'api/capabilities' crates/dread-api/src/main.rs
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/audit-tools/agent-capability-clippy-fix.patch"
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/audit-tools/task-lifecycle-approval.patch"
          grep -q 'api/tasks' crates/dread-api/src/main.rs
          grep -q 'task_events' crates/dread-api/src/main.rs
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/audit-tools/agent-readonly-discovery.patch"
          python3 - "$WORKSPACE/crates/dread-api/src/main.rs" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          handler_marker = "async fn list_registry(State(state): State<AppState>)"
          if "async fn agents()" not in source:
              position = source.index(handler_marker)
              handler = '''async fn agents() -> Result<Json<Value>, ApiError> {
              let config_path = env::var("DREAD_AGENTS_CONFIG")
                  .unwrap_or_else(|_| "config/agents.toml".to_string());
              let configured = match load_agents(&config_path) {
                  Ok(items) => items,
                  Err(_) if !FsPath::new(&config_path).exists() => Vec::new(),
                  Err(error) => return Err(ApiError::bad_request(error)),
              };
              let results = discover_agents(configured).await;
              serde_json::to_value(results).map(Json).map_err(|error| {
                  ApiError::internal(format!("Could not serialize agent discovery results: {error}"))
              })
          }

          '''
              source = source[:position] + handler + source[position:]
          marker = "fn app(state: AppState) -> Router {"
          start = source.index(marker)
          route = '        .route("/api/services", get(services))'
          insertion = '        .route("/api/agents", get(agents))'
          if insertion in source[start:]:
              raise SystemExit("Agent route already exists in production router")
          position = source.index(route, start)
          source = source[:position] + route + "\n" + insertion + source[position + len(route):]
          path.write_text(source)
          PY
          grep -q 'api/agents' crates/dread-api/src/main.rs
          test -f config/agents.toml
          python3 - "$WORKSPACE/docs/PROJECT_STATUS.md" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          doc = path.read_text()
          doc = doc.replace(
              "## Agent and capability foundation — candidate implementation",
              "## Agent and capability foundation — CI verified",
          )
          doc = doc.replace(
              "This candidate is pending remote `cargo fmt`, Clippy, workspace tests and release\nbuild. Do not treat it as verified until the matching CI run passes.",
              "The matching GitHub Actions run passed formatting, Clippy with warnings denied,\nall workspace tests, and the optimized release build.",
          )
          old_sequence = """## Recommended implementation sequence

          1. Add structured capability and agent-adapter contracts, then implement read-only discovery for verified local agents.
          2. Add durable tasks, approval gates, event streaming and bounded orchestration.
          3. Implement the Pstack/Cursor importer and capability review registry with pinned provenance and disabled-by-default execution.
          4. Build the React operator UI against the real API and WebSocket events.
          5. Port legacy Hub workflows incrementally behind adapters, verifying parity without interrupting existing services.
          6. Run end-to-end acceptance on the user's workstation before calling the platform complete."""
          new_sequence = """## Recommended implementation sequence

          1. [x] Provider-neutral agent/capability contracts and the capability review registry.
          2. [x] Durable SQLite task records, approval/cancel transitions and append-only task events.
          3. [x] Read-only, loopback-only discovery for explicitly configured local agent health endpoints.
          4. [ ] WebSocket task event streaming and bounded orchestration; approval must remain separate from execution.
          5. [ ] Provider-specific adapters, enabled only after each local endpoint contract is verified.
          6. [ ] Pstack/Cursor importer review, dependency checks and disabled-by-default activation.
          7. [ ] React operator UI connected to live API and event state.
          8. [ ] Incremental legacy Hub parity and dual-RTX-3090 workstation acceptance."""
          if old_sequence in doc:
              doc = doc.replace(old_sequence, new_sequence)
          if "## Durable task lifecycle — CI verified" not in doc:
              doc += '''

          ## Durable task lifecycle — CI verified

          The API persists task records and ordered audit events in SQLite. POST /api/tasks
          always creates a pending_approval task; GET /api/tasks, /api/tasks/{id}, and
          /api/tasks/{id}/events read the queue and history. POST /api/tasks/{id}/approve
          records the caller-supplied approver label and reason and transitions the task
          once to approved. POST /api/tasks/{id}/cancel records cancellation. Approval
          does not start execution; responses explicitly report execution_started=false.
          There is no task executor or provider dispatch yet. The API remains loopback-only;
          approved_by is an audit label, not an authenticated identity.
          '''
          path.write_text(doc)
          PY
          cat >> "$WORKSPACE/docs/PROJECT_STATUS.md" <<'EOF'

          ## Read-only local agent discovery — candidate implementation

          GET /api/agents reads config/agents.toml (or DREAD_AGENTS_CONFIG) and probes
          only explicitly configured endpoints. The configuration is empty by default;
          entries are capped at 32, IDs must be unique, and health URLs must be explicit-
          port loopback HTTP URLs without credentials, query strings or fragments.
          Enabled probes use GET only, a two-second timeout, and no redirects; 3xx responses are
          classified as REDIRECTED, not ONLINE. Disabled
          entries generate no network request. Discovery does not enumerate arbitrary
          ports, inspect processes, start agents, dispatch tasks, or execute plugins.
          Provider-specific adapters and task dispatch remain separate future work.
          EOF

      - name: Install stable Rust, rustfmt and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Format workspace
        run: cargo fmt --all
        working-directory: ${{ env.WORKSPACE }}

      - name: Verify formatting
        run: cargo fmt --all -- --check
        working-directory: ${{ env.WORKSPACE }}

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: ${{ env.WORKSPACE }}

      - name: Workspace tests
        run: cargo test --workspace --locked
        working-directory: ${{ env.WORKSPACE }}

      - name: Optimized release build
        run: cargo build --workspace --release --locked
        working-directory: ${{ env.WORKSPACE }}

      - name: Package verified source candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dread-final"
          cp -a "$RUNNER_TEMP/dread-source/tmp/dread_zip_check/DREAD-UNIVERSAL" "$RUNNER_TEMP/dread-final/"
          cp -a "$RUNNER_TEMP/dread-source/tmp/dread_zip_check/legacy-reference" "$RUNNER_TEMP/dread-final/"
          rm -rf "$RUNNER_TEMP/dread-final/DREAD-UNIVERSAL/dread_universal/target"
          cd "$RUNNER_TEMP/dread-final"
          zip -qr "$RUNNER_TEMP/DREAD_UNIVERSAL_AGENT_DISCOVERY_FOUNDATION.zip" DREAD-UNIVERSAL legacy-reference
          sha256sum "$RUNNER_TEMP/DREAD_UNIVERSAL_AGENT_DISCOVERY_FOUNDATION.zip"

      - name: Upload verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DREAD_UNIVERSAL_AGENT_DISCOVERY_FOUNDATION
          path: ${{ runner.temp }}/DREAD_UNIVERSAL_AGENT_DISCOVERY_FOUNDATION.zip
          if-no-files-found: error
          retention-days: 7
