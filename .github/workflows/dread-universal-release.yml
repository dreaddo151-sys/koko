name: DREAD Universal Ubuntu Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: New release tag to create at the selected commit (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dread-ubuntu-release
  cancel-in-progress: false

jobs:
  package:
    name: Build Ubuntu 24.04 packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Rust API
        working-directory: dread_universal
        run: cargo build --release --locked --bin dread-universal
      - name: Build production web console
        working-directory: dread_universal/web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Validate packaging scripts
        working-directory: dread_universal
        run: bash -n scripts/install-user.sh scripts/configure-user.sh scripts/package-ubuntu.sh
      - name: Assemble tarball, deb and SHA-256 manifest
        working-directory: dread_universal
        run: scripts/package-ubuntu.sh
      - name: Verify release package contents
        working-directory: dread_universal
        run: |
          set -euo pipefail
          test -s dist/release/SHA256SUMS
          sha256sum --check dist/release/SHA256SUMS
          dpkg-deb --info dist/release/dread-universal_*.deb
          tar -tzf dist/release/dread-universal-ubuntu-*.tar.gz | grep -q 'bundle/bin/dread-universal'
          tar -tzf dist/release/dread-universal-ubuntu-*.tar.gz | grep -q 'bundle/web/dist/index.html'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dread_universal/dist/release/dread-universal-ubuntu-*.tar.gz
            dread_universal/dist/release/dread-universal_*.deb
            dread_universal/dist/release/SHA256SUMS
