# Local endpoints monitored by DREAD Universal service discovery.
# All endpoints remain loopback-only. Inference is served by the local
# llama.cpp-compatible GPU gateway; Ollama is intentionally not configured.

[[services]]
id = "dread-hub"
name = "PROJECT DREAD Legacy Hub"
url = "http://127.0.0.1:8080/"
role = "legacy-control-plane"

[[services]]
id = "comfyui"
name = "ComfyUI"
url = "http://127.0.0.1:8188/system_stats"
role = "image-video-runtime"

[[services]]
id = "llama-cpp-gateway"
name = "DREAD llama.cpp GPU Gateway"
url = "http://127.0.0.1:11500/health"
role = "local-inference"
