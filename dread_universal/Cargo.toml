[workspace]
resolver = "2"
members = ["crates/dread-discovery", "crates/dread-api", "crates/dread-gpu", "crates/dread-agents", "crates/dread-orchestrator"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["PROJECT DREAD contributors"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
